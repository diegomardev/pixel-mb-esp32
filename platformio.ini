[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
extra_scripts =
  pre:tools/embed_web.py
  pre:tools/configure_ota.py
  post:tools/ota_upload.py
build_src_filter = +<*> -<led_test.cpp>
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  adafruit/Adafruit NeoPixel@1.12.3
  adafruit/Adafruit NeoMatrix@1.3.3
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit BusIO@1.16.2
  adafruit/Adafruit BMP280 Library@2.6.8
  adafruit/Adafruit BME280 Library@2.2.4
  adafruit/Adafruit Unified Sensor@1.1.14
build_unflags = -std=gnu++11
build_flags = -Wall -Wextra -std=gnu++17

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = custom
upload_command = "$PYTHONEXE" "$PROJECT_DIR/tools/http_ota_upload.py" "$SOURCE"

[env:led-test]
extends = env:esp32dev
build_src_filter = -<*> +<led_test.cpp>
